name: Devnet Build

on:
    pull_request:
      types: [closed]

env:
    AWS_REGION: ${{ vars.AWS_REGION }}
    REPO_URL: ${{ vars.ECR_REPO_URL }}
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    DOCKER_IMAGE: ${{ vars.ECR_REPO_URL }}/limechain/devnet:latest

jobs:
    build-devnet:
        if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'CI:Deploy')
        runs-on: ubuntu-latest
        
        steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Setup AWS CLI credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Login to Amazon ECR
          run: aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.REPO_URL }}
        
        - name: Build and push Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: Dockerfile.devnet
            push: true
            tags: ${{ env.DOCKER_IMAGE }}
            
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            
        - name: Install Hardhat dependencies
          working-directory: ./hardhat
          run: npm install
          
        - name: Start local devnet container
          run: |
            docker pull ${{ env.DOCKER_IMAGE }}
            docker run -d -p 8545:8545 -p 8546:8546 -p 8547:8547 -p 30303:30303 --name devnet-test ${{ env.DOCKER_IMAGE }}
            
        - name: Run Hardhat tests against devnet
          working-directory: ./hardhat
          run: npm run test
          
        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3
          
        - name: Terraform Init
          working-directory: ./terraform
          run: terraform init
          
        - name: Terraform Plan
          working-directory: ./terraform
          run: terraform plan -var="docker_image=${{ env.DOCKER_IMAGE }}" -out=tfplan
          
        - name: Terraform Apply EKS Only
          working-directory: ./terraform
          run: |
            # Apply only the EKS module first (this will exclude Kubernetes resources)
            terraform apply -target=module.eks -var="docker_image=${{ env.DOCKER_IMAGE }}" -auto-approve
          
        - name: Get Kubernetes Config and Test Connection
          run: |
            # Get cluster name from Terraform
            CLUSTER_NAME=$(terraform -chdir=./terraform output -raw cluster_name)
            echo "Configuring kubectl for cluster: $CLUSTER_NAME"
            
            # Update kubeconfig
            aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name $CLUSTER_NAME
            
            # Verify kubeconfig is working
            kubectl cluster-info
            
            # Wait for API server to be fully available
            echo "Waiting for Kubernetes API to be fully available..."
            sleep 30
            
            # Verify permissions
            echo "Testing Kubernetes permissions..."
            kubectl auth can-i create deployments
            kubectl auth can-i create services
            
        - name: Apply Kubernetes Resources
          working-directory: ./terraform
          run: |
            # Now apply everything else
            terraform apply -var="docker_image=${{ env.DOCKER_IMAGE }}" -auto-approve tfplan
            
        - name: Verify Deployment
          run: |
            kubectl get deployments
            kubectl get services
            
        - name: Output Service Endpoint
          working-directory: ./terraform
          run: |
            echo "Devnet service endpoint: $(terraform output -raw service_endpoint)"
