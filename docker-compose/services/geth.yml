services:
  geth:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: limechain-geth:latest
    ports:
      - "8545:8545"
      - "8546:8546"
      - "30303:30303"
      - "30303:30303/udp"
    volumes:
      - geth-data:/root/.ethereum
    command: >
      --dev --http --http.addr=0.0.0.0 --http.api=eth,net,web3,debug,txpool --http.vhosts="*" --http.corsdomain="*" --ws --ws.addr=0.0.0.0 --ws.origins="*"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "geth", "attach", "--exec", "eth.blockNumber", "/tmp/geth.ipc" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
